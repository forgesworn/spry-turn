[package]
name = "spry-access"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
authors = ["TheCryptoDonkey"]
description = "Owner-controlled pairing and scoped, short-lived access to Spry relays"
repository = "https://github.com/forgesworn/spry-turn"
readme = "README.md"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
hmac = "=0.12.1"
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
url = "=2.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
