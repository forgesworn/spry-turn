[package]
name = "spry-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
authors = ["TheCryptoDonkey"]
description = "Standalone Spry pairing service and embeddable HTTP host adapter"
repository = "https://github.com/forgesworn/spry-turn"

[[bin]]
name = "spry-node"
path = "src/main.rs"

[dependencies]
spry-access = { path = "../spry-access", version = "=0.1.0" }
spry-link = { path = "../spry-link", version = "=0.1.0" }
spry-portmap = { path = "../spry-portmap", version = "=0.1.0" }
spry-turn = { path = "../..", version = "=0.4.0", default-features = false, features = ["runtime", "turn", "connected-udp"] }
socket2 = { version = "=0.6.5", features = ["all"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.11"
bytes = "=1.12.1"
getrandom = "=0.3.4"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "signal", "process", "io-util", "macros"] }
url = "=2.5.8"

[dev-dependencies]
spry-portmap = { path = "../spry-portmap", version = "=0.1.0", features = ["testing"] }
base64 = "=0.22.1"
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
