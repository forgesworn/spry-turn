name: ci
# Branch pushes are covered by their pull request; running both doubled the
# runner demand for every commit.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run check:docs
      - run: node tests/kithmoot-guard.mjs
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 15 November 2026
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Remap Linux build paths
        if: matrix.os == 'ubuntu-24.04'
        run: echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/spry-turn --remap-path-prefix=$HOME/.cargo=/cargo-home" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - run: cargo build --locked --release --workspace --features tls
      - run: cargo build --locked --release --features tls --example load
      - name: Verify diagnostic loader failure boundaries
        run: python3 -B -m unittest discover -s tests -p test_sparse_diagnostics.py -v
        env:
          SPRY_DIAGNOSTIC_LOADER: target/release/examples/load
      - run: cargo test --locked --workspace --all-features
        env:
          SPRY_TEST_RELAY_BINARY: target/release/spry-turn
      - name: Exercise parent-lifetime startup diagnostics in a bounded repetition
        run: |
          for repeat in {1..20}; do
            cargo test --locked --all-features --test parent_lifetime -- --test-threads=4
          done
      - run: cargo test --locked --no-default-features --lib
      - run: cargo test --locked --no-default-features --features turn --lib
      - name: Lint the TLS-only feature set, which no other step builds
        run: cargo clippy --locked --no-default-features --features tls --all-targets -- -D warnings
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo fmt --manifest-path experiments/linux-batch/Cargo.toml -- --check
          cargo clippy --locked --manifest-path experiments/linux-batch/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/linux-batch/Cargo.toml --target-dir target
          mkdir -p .local
          cargo run --locked --release --manifest-path experiments/linux-batch/Cargo.toml --target-dir target -- --packets 1024 --runs 1 > .local/ci-batching.jsonl
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features wasm --lib -- -D warnings
          cargo build --locked --release --target wasm32-unknown-unknown --no-default-features --features wasm --lib
      - run: python3 tests/interop.py --tls
      - run: python3 tests/stress.py --binary target/release/spry-turn --seconds 15 --tls --output .local/ci-stress.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/pairing-handoff.mjs
      - run: python3 tests/browser.py --tls --relay-ports 49160:49191
      - name: Package checked Linux standalone executables
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/package-linux.py
      - name: Upload Linux CI artefact (not a release)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spry-standalone-linux-x86_64-${{ github.sha }}
          path: |
            .local/linux-artifact/*.tar.gz
            .local/linux-artifact/*.sha256
          if-no-files-found: error
          retention-days: 3
  # Cargo.toml and the README state Rust 1.85 as the minimum; keep it true.
  msrv:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 15 November 2026
        with:
          toolchain: "1.85"
      - run: cargo check --locked --workspace --all-features
  # The release workflow ships x86_64-pc-windows-msvc executables. The
  # socket, browser and stress fixtures above are POSIX harnesses; this job
  # runs the Rust suite against the Windows release build.
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 15 November 2026
        with:
          toolchain: stable
      - run: cargo build --locked --release --workspace --features tls
      - run: cargo test --locked --workspace --all-features --no-fail-fast
        env:
          SPRY_TEST_RELAY_BINARY: target/release/spry-turn.exe
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [wire, portmap, link]
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 15 November 2026
        with:
          toolchain: nightly-2025-12-05
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: python3 tests/fuzz.py --toolchain nightly-2025-12-05 --target ${{ matrix.target }} --seconds 30 --output .local/ci-fuzz-${{ matrix.target }}.json
