[package]
name = "spry-turn"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["TheCryptoDonkey"]
description = "Lightweight Rust STUN/TURN server and embeddable packet codec with UDP, TCP, TLS and WASM support"
repository = "https://github.com/forgesworn/spry-turn"
documentation = "https://github.com/forgesworn/spry-turn/blob/main/docs/README.md"
readme = "README.md"
keywords = ["turn", "stun", "webrtc", "relay", "wasm"]
categories = ["network-programming", "command-line-utilities", "wasm"]
publish = false

[features]
default = ["runtime", "turn", "connected-udp"]
runtime = ["dep:mio", "dep:getrandom"]
turn = ["dep:base64", "dep:crc32fast", "dep:hmac", "dep:md-5", "dep:sha1"]
tls = ["runtime", "turn", "dep:rustls", "dep:rustls-pemfile"]
wasm = ["turn", "dep:wasm-bindgen"]
direct-index = ["runtime", "turn"]
connected-udp = ["direct-index", "dep:socket2"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
mio = { version = "=1.2.4", features = ["net", "os-poll"], optional = true }
base64 = { version = "=0.22.1", optional = true }
crc32fast = { version = "=1.5.0", optional = true }
getrandom = { version = "=0.3.4", optional = true }
hmac = { version = "=0.12.1", optional = true }
md-5 = { version = "=0.10.6", optional = true }
sha1 = { version = "=0.10.6", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
socket2 = { version = "=0.6.5", features = ["all"], optional = true }

[[bin]]
name = "spry-turn"
path = "src/main.rs"
required-features = ["runtime"]

[[example]]
name = "load"
required-features = ["runtime", "turn"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
